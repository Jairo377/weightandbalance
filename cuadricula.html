<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PA-38-112 Performance Calculator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        .contenedor {
            border: 2px solid #666;
            display: inline-block;
            background-color: white;
            position: relative;
        }
        .etiquetas-contenedor {
            position: relative;
            width: 480px;
            height: 20px;
            margin-top: 2px;
            margin-bottom: 2px;
        }
        #etiquetas2 {
            width: 600px;
        }
        .cuadricula {
            position: relative;
            width: 480px;
            height: 360px;
        }
        #cuadricula2 {
            width: 600px;
            height: 240px;
        }
        .linea-vertical {
            position: absolute;
            width: 1px;
            height: 100%;
            background-color: #c0c0c0;
            top: 0;
        }
        .linea-horizontal {
            position: absolute;
            height: 1px;
            width: 100%;
            background-color: #c0c0c0;
            left: 0;
        }
        .etiqueta-temperatura {
            position: absolute;
            top: 0;
            font-family: Arial, sans-serif;
            font-size: 9px;
            color: #333;
            transform: translateX(-50%);
        }
        .etiquetas-y-contenedor {
            position: absolute;
            right: -35px;
            top: 0;
            width: 35px;
            height: 100%;
        }
        .etiqueta-y {
            position: absolute;
            left: 5px;
            font-family: Arial, sans-serif;
            font-size: 9px;
            color: #333;
            transform: translateY(-50%);
        }
        .titulo-principal {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-bottom: 3px;
        }
        .titulo-modelo {
            font-size: 16px;
            font-weight: bold;
            margin: 0 0 2px 0;
        }
        .titulo-performance {
            font-size: 14px;
            font-weight: bold;
            margin: 0 0 8px 0;
        }
        .etiqueta-eje-y {
            position: absolute;
            left: 41px; /* 35px (numbers container) + 6px (gap) */
            top: 70%;   /* Vertically centered */
            transform: translateY(-50%) rotate(-90deg); /* Center and rotate */
            transform-origin: left center;
            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: bold;
            color: #333;
            white-space: nowrap;
            padding-left: 0;
        }
        .etiqueta-eje-x {
            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin: 0;
            margin-bottom: 2px; /* Small gap below text */
            margin-top: 0;      /* Remove extra space above */
            line-height: 1.1;   /* Slightly tighter line spacing */
        }
        .contenedor-wrapper {
            position: relative;
            display: inline-block;
        }
        .grafica-scroll-container {
            width: 100%;
            overflow-x: auto;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
        }
        .grafica-scroll-container::-webkit-scrollbar {
            height: 8px;
        }
        .grafica-scroll-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .grafica-scroll-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        .grafica-scroll-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .grafica-content {
            display: inline-block;
            min-width: min-content;
        }
        .etiquetas-x-contenedor {
            display: flex;
            width: 480px;
            margin-top: -8px; /* Move up closer to numbers */
        }
        .etiquetas-x-contenedor.segunda-grafica {
            width: 600px;
        }
        .etiqueta-x-izq {
            flex: 0 0 330px;
            text-align: center;
        }
        .etiqueta-x-der {
            flex: 0 0 150px;
            text-align: left; /* Align text to the left */
            margin-left: 0;
            padding-left: 0;
        }
        /* Etiquetas específicas para segunda gráfica */
        .etiquetas-x-contenedor.segunda-grafica .etiqueta-x-izq {
            flex: 0 0 420px;
        }
        .etiquetas-x-contenedor.segunda-grafica .etiqueta-x-der {
            flex: 0 0 180px;
            text-align: left;
        }
        .controles-container {
            background-color: white;
            padding: 15px;
            border: 2px solid #666;
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            width: 100%;
            max-width: 900px;
        }
        .control-grupo {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1 1 auto;
            min-width: 140px;
        }
        .control-grupo label {
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;
            color: #333;
        }
        .control-grupo input {
            padding: 8px 10px;
            border: 1px solid #999;
            border-radius: 3px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            width: 100%;
            min-height: 40px;
        }
        .error-message {
            display: none;
            color: #d32f2f;
            font-size: 12px;
            font-weight: bold;
            margin-top: 3px;
        }
        .error-message.visible {
            display: block;
        }
        #calcular, #limpiar {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            min-height: 44px;
            flex: 1 1 auto;
            min-width: 100px;
        }
        #limpiar {
            background-color: #f44336;
        }
        #calcular:hover {
            background-color: #45a049;
        }
        #limpiar:hover {
            background-color: #da190b;
        }
        .resultado {
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;
            color: #333;
            padding: 10px 12px;
            background-color: #e8f5e9;
            border-radius: 3px;
            width: 100%;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            word-wrap: break-word;
            white-space: pre-line;
        }

        /* Media Queries para Responsive Design */

        /* Tablet: 481px - 768px */
        @media (max-width: 768px) {
            body {
                padding: 10px 5px;
            }

            .titulo-modelo {
                font-size: 14px;
            }

            .titulo-performance {
                font-size: 12px;
            }

            .controles-container {
                padding: 12px;
                gap: 10px;
            }

            .control-grupo {
                min-width: 120px;
            }

            .control-grupo label {
                font-size: 11px;
            }

            .control-grupo input {
                font-size: 13px;
                padding: 7px 8px;
            }

            #calcular, #limpiar {
                font-size: 13px;
                padding: 8px 15px;
            }

            .resultado {
                font-size: 13px;
                padding: 8px 10px;
            }

            .etiqueta-temperatura {
                font-size: 8px;
            }

            .etiqueta-y {
                font-size: 8px;
            }

            .etiqueta-eje-x {
                font-size: 10px;
            }

            .etiqueta-eje-y {
                font-size: 10px;
            }
        }

        /* Mobile: menos de 480px */
        @media (max-width: 480px) {
            body {
                padding: 5px;
            }

            .controles-container {
                padding: 10px;
                gap: 8px;
            }

            .control-grupo {
                flex: 1 1 100%;
                min-width: 100%;
            }

            .control-grupo label {
                font-size: 13px;
            }

            .control-grupo input {
                font-size: 16px;
                padding: 10px 12px;
                min-height: 44px;
            }

            #calcular, #limpiar {
                flex: 1 1 48%;
                min-width: 48%;
                font-size: 14px;
                padding: 12px 15px;
                min-height: 48px;
            }

            .resultado {
                font-size: 13px;
                padding: 10px 8px;
                line-height: 1.3;
            }

            .titulo-modelo {
                font-size: 14px;
            }

            .titulo-performance {
                font-size: 12px;
                margin-bottom: 5px;
            }

            /* Ajustar tamaños de texto en gráficas para mejor legibilidad */
            .etiqueta-temperatura {
                font-size: 9px;
            }

            .etiqueta-y {
                font-size: 9px;
            }

            .etiqueta-eje-x {
                font-size: 10px;
            }

            .etiqueta-eje-y {
                font-size: 9px;
            }
        }

        /* Mobile muy pequeño: menos de 360px */
        @media (max-width: 360px) {
            .resultado {
                font-size: 12px;
                padding: 8px 6px;
            }

            #calcular, #limpiar {
                font-size: 13px;
                padding: 10px 12px;
            }

            .control-grupo label {
                font-size: 12px;
            }

            .titulo-modelo {
                font-size: 13px;
            }

            .titulo-performance {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="controles-container">
        <div class="control-grupo">
            <label for="temperatura">Temperatura (°C):</label>
            <input type="number" id="temperatura" min="-30" max="40" step="1" placeholder="-30 a 40">
        </div>
        <div class="control-grupo">
            <label for="elevacion">Elevación del aeropuerto (pies):</label>
            <input type="number" id="elevacion" min="0" max="7000" step="1" value="2021" placeholder="0 a 7000">
        </div>
        <div class="control-grupo">
            <label for="viento">Viento (0-15 knots):</label>
            <input type="number" id="viento" min="0" max="15" step="1" placeholder="0 a 15">
            <span id="error-viento" class="error-message"></span>
        </div>
        <button id="calcular">Calcular</button>
        <button id="limpiar">Limpiar</button>
        <div id="resultado" class="resultado"></div>
    </div>
    <div class="titulo-principal">
        <div class="titulo-modelo">PA-38-112</div>
        <div class="titulo-performance">TAKE OFF PERFORMANCE</div>
    </div>
    <div class="grafica-scroll-container">
        <div class="grafica-content">
            <div class="contenedor-wrapper">
                <div class="contenedor">
                    <div class="cuadricula" id="cuadricula">
                        <div class="etiquetas-y-contenedor" id="etiquetas-y">
                            <div class="etiqueta-eje-y">Take off ground roll - Feet</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="etiquetas-contenedor" id="etiquetas"></div>
            <div class="etiquetas-x-contenedor">
                <div class="etiqueta-x-izq etiqueta-eje-x">Outside air temp - C</div>
                <div class="etiqueta-x-der etiqueta-eje-x">Wind - knots</div>
            </div>
        </div>
    </div>

    <!-- Segunda gráfica: LANDING GROUND ROLL -->
    <div class="titulo-principal" style="margin-top: 40px;">
        <div class="titulo-modelo">PA-38-112</div>
        <div class="titulo-performance">LANDING GROUND ROLL</div>
    </div>
    <div class="grafica-scroll-container">
        <div class="grafica-content">
            <div class="contenedor-wrapper">
                <div class="contenedor">
                    <div class="cuadricula" id="cuadricula2">
                        <div class="etiquetas-y-contenedor" id="etiquetas-y2">
                            <div class="etiqueta-eje-y">Landing ground roll - Feet</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="etiquetas-contenedor" id="etiquetas2"></div>
            <div class="etiquetas-x-contenedor segunda-grafica">
                <div class="etiqueta-x-izq etiqueta-eje-x">Outside air temp - C</div>
                <div class="etiqueta-x-der etiqueta-eje-x">Wind - knots</div>
            </div>
        </div>
    </div>
    <script>
        const cuadricula = document.getElementById('cuadricula');
        for (let i = 0; i < 80; i++) {
            const linea = document.createElement('div');
            linea.className = 'linea-vertical';
            linea.style.left = (i * 6) + 'px';
            linea.style.zIndex = '1';
            if (i % 5 === 0) {
                linea.style.backgroundColor = '#909090';
                linea.style.zIndex = '5';
            }
            if (i === 55) {
                linea.style.backgroundColor = '#000000';
                linea.style.zIndex = '10';
            }
            cuadricula.appendChild(linea);
        }
        for (let i = 0; i < 60; i++) {
            const linea = document.createElement('div');
            linea.className = 'linea-horizontal';
            linea.style.top = (i * 6) + 'px';
            linea.style.zIndex = '1';
            if (i % 5 === 0) {
                linea.style.backgroundColor = '#909090';
                linea.style.zIndex = '5';
            }
            cuadricula.appendChild(linea);
        }
        const etiquetasContenedor = document.getElementById('etiquetas');
        const temperaturas = [-30, -20, -10, 0, 10, 20, 30, 40];
        temperaturas.forEach((temp, index) => {
            const etiqueta = document.createElement('div');
            etiqueta.className = 'etiqueta-temperatura';
            const posicion = (5 + (index * 5)) * 6;
            etiqueta.style.left = posicion + 'px';
            etiqueta.textContent = temp + '°';
            etiquetasContenedor.appendChild(etiqueta);
        });
        const numerosAdicionales = [0, 5, 10, 15];
        const inicioNumerosAdicionales = 40 + 15;
        numerosAdicionales.forEach((num, index) => {
            const etiqueta = document.createElement('div');
            etiqueta.className = 'etiqueta-temperatura';
            const posicion = (inicioNumerosAdicionales + (index * 5)) * 6;
            etiqueta.style.left = posicion + 'px';
            etiqueta.textContent = num;
            etiquetasContenedor.appendChild(etiqueta);
        });
        const etiquetasY = document.getElementById('etiquetas-y');
        const valorInicial = 500;
        const incremento = 100;
        const cuadrosDisponibles = Math.floor(60 / 5) + 1;
        for (let i = 0; i < cuadrosDisponibles; i++) {
            const etiqueta = document.createElement('div');
            etiqueta.className = 'etiqueta-y';
            const lineaDesdeAbajo = i * 5;
            const posicion = 360 - (lineaDesdeAbajo * 6);
            const valor = valorInicial + (i * incremento);
            etiqueta.style.top = posicion + 'px';
            etiqueta.textContent = valor;
            etiquetasY.appendChild(etiqueta);
        }
        const svgNS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(svgNS, 'svg');
        svg.style.position = 'absolute';
        svg.style.top = '0';
        svg.style.left = '0';
        svg.style.width = '100%';
        svg.style.height = '100%';
        svg.style.pointerEvents = 'none';
        svg.style.zIndex = '8';
        cuadricula.insertBefore(svg, cuadricula.firstChild);
        // Función para convertir temperatura (outside air temp) a coordenadas X
        // Rango: -30 a 40 grados (lado izquierdo)
        function tempToX(temp) {
            const cuadro = 5 + ((temp + 30) / 10) * 5;
            return cuadro * 6;
        }

        // Función para convertir wind component a coordenadas X
        // Rango: 0 a 15 (lado derecho)
        // Wind 0 está en cuadro 55, wind 15 está en cuadro 70
        function windToX(wind) {
            const cuadro = 55 + (wind / 5) * 5;
            return cuadro * 6;
        }

        function valorToY(valor) {
            const cuadrosDesdeAbajo = (valor - 500) / 100 * 5;
            return 360 - (cuadrosDesdeAbajo * 6);
        }
        const x1 = tempToX(-7.7);
        const y1 = valorToY(500);
        const x2 = tempToX(40);
        const y2 = valorToY(1160);
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        line.setAttribute('stroke', 'black');
        line.setAttribute('stroke-width', '2');
        svg.appendChild(line);

        // Label "SEA LEVEL" en 0°C sobre la línea principal
        // Calcular Y en la línea principal cuando X = 0°C
        // Línea va de (-7.7, 500) a (40, 1160)
        const temp0 = 0;
        const x0 = tempToX(temp0);
        // Interpolación lineal: y = y1 + (y2 - y1) * (x - x1) / (x2 - x1)
        const y0Linea = 500 + (1160 - 500) * (temp0 - (-7.7)) / (40 - (-7.7));
        const y0 = valorToY(y0Linea);

        // Calcular el ángulo de la línea
        const angulo = Math.atan2(y2 - y1, x2 - x1) * (180 / Math.PI);

        const seaLevelText = document.createElementNS(svgNS, 'text');
        seaLevelText.setAttribute('x', x0);
        seaLevelText.setAttribute('y', y0 - 8); // 8px arriba de la línea
        seaLevelText.setAttribute('text-anchor', 'middle');
        seaLevelText.setAttribute('font-family', 'Arial, sans-serif');
        seaLevelText.setAttribute('font-size', '8');
        seaLevelText.setAttribute('font-weight', 'bold');
        seaLevelText.setAttribute('fill', 'black');
        seaLevelText.setAttribute('stroke', 'white');
        seaLevelText.setAttribute('stroke-width', '2.5');
        seaLevelText.setAttribute('paint-order', 'stroke');
        seaLevelText.setAttribute('transform', `rotate(${angulo}, ${x0}, ${y0 - 8})`);
        seaLevelText.textContent = 'SEA LEVEL';
        svg.appendChild(seaLevelText);

        // Líneas del lado izquierdo (outside air temp: -30 a 40°)
        const lineasIzquierda = [
            { x1: -17, y1: 500, x2: 40, y2: 1310 },
            { x1: -26.5, y1: 500, x2: 40, y2: 1460 },
            { x1: -30, y1: 578, x2: 40, y2: 1620 },
            { x1: -30, y1: 760, x2: 36, y2: 1700 },
            { x1: -30, y1: 878, x2: 24, y2: 1700 },
            { x1: -30, y1: 1020, x2: 12, y2: 1700 },
            { x1: -30, y1: 1200, x2: 2, y2: 1700 },
            { x1: 1, y1: 1670, x2: 15, y2: 820 }
        ];

        lineasIzquierda.forEach((coords, index) => {
            const newLine = document.createElementNS(svgNS, 'line');
            const lineX1 = tempToX(coords.x1);
            const lineY1 = valorToY(coords.y1);
            const lineX2 = tempToX(coords.x2);
            const lineY2 = valorToY(coords.y2);

            newLine.setAttribute('x1', lineX1);
            newLine.setAttribute('y1', lineY1);
            newLine.setAttribute('x2', lineX2);
            newLine.setAttribute('y2', lineY2);
            newLine.setAttribute('stroke', 'black');
            newLine.setAttribute('stroke-width', '2');
            svg.appendChild(newLine);

            // Agregar texto de elevación en las primeras 7 líneas (1000, 2000, 3000, etc.)
            if (index < 7) {
                const elevacion = (index + 1) * 1000;

                // Calcular posición en -10°C para mayor visibilidad
                const tempLine = -10;
                const xLine = tempToX(tempLine);
                // Interpolación lineal para Y
                const yLineaVal = coords.y1 + (coords.y2 - coords.y1) * (tempLine - coords.x1) / (coords.x2 - coords.x1);
                const yLine = valorToY(yLineaVal);

                // Calcular ángulo de la línea
                const anguloLine = Math.atan2(lineY2 - lineY1, lineX2 - lineX1) * (180 / Math.PI);

                const labelElevacion = document.createElementNS(svgNS, 'text');
                labelElevacion.setAttribute('x', xLine);
                labelElevacion.setAttribute('y', yLine - 8);
                labelElevacion.setAttribute('text-anchor', 'middle');
                labelElevacion.setAttribute('font-family', 'Arial, sans-serif');
                labelElevacion.setAttribute('font-size', '8');
                labelElevacion.setAttribute('font-weight', 'bold');
                labelElevacion.setAttribute('fill', 'black');
                labelElevacion.setAttribute('stroke', 'white');
                labelElevacion.setAttribute('stroke-width', '2.5');
                labelElevacion.setAttribute('paint-order', 'stroke');
                labelElevacion.setAttribute('transform', `rotate(${anguloLine}, ${xLine}, ${yLine - 8})`);
                labelElevacion.textContent = elevacion.toString();
                svg.appendChild(labelElevacion);
            }
        });

        // Líneas del lado derecho (wind component: 0 a 15)
        const lineasDerecha = [
            { x1: 0, y1: 800, x2: 15, y2: 550 },
            { x1: 0, y1: 930, x2: 15, y2: 690 },
            { x1: 0, y1: 1070, x2: 15, y2: 790 },
            { x1: 0, y1: 1190, x2: 15, y2: 870 },
            { x1: 0, y1: 1310, x2: 15, y2: 970 },
            { x1: 0, y1: 1430, x2: 15, y2: 1070 },
            { x1: 0, y1: 1560, x2: 15, y2: 1170 },
            { x1: 0, y1: 1690, x2: 15, y2: 1270 }
        ];

        lineasDerecha.forEach(coords => {
            const newLine = document.createElementNS(svgNS, 'line');
            newLine.setAttribute('x1', windToX(coords.x1));
            newLine.setAttribute('y1', valorToY(coords.y1));
            newLine.setAttribute('x2', windToX(coords.x2));
            newLine.setAttribute('y2', valorToY(coords.y2));
            newLine.setAttribute('stroke', 'black');
            newLine.setAttribute('stroke-width', '2');
            svg.appendChild(newLine);
        });

        // ========== SEGUNDA GRÁFICA: LANDING GROUND ROLL ==========
        const cuadricula2 = document.getElementById('cuadricula2');

        // Funciones de conversión para segunda gráfica
        function tempToX2(temp) {
            const cuadro = ((temp + 20) / 10) * 10; // -20 en cuadro 0, 40 en cuadro 60
            return cuadro * 6;
        }

        function windToX2(wind) {
            const cuadro = 70 + (wind / 5) * 10; // 0 en cuadro 70, 15 en cuadro 100
            return cuadro * 6;
        }

        function valorToY2(valor) {
            const cuadrosDesdeAbajo = (valor - 600) / 10; // Cada cuadro = 10 pies
            return (40 * 6) - (cuadrosDesdeAbajo * 6); // 240px total - offset
        }

        // Líneas verticales (100 cuadros)
        for (let i = 0; i < 100; i++) {
            const linea = document.createElement('div');
            linea.className = 'linea-vertical';
            linea.style.left = (i * 6) + 'px';

        // Variables globales para almacenar elementos dibujados - Take Off
        let puntoActual = null;

        // Variables globales para almacenar elementos dibujados - Landing

        // Función para calcular el punto de take-off performance
        function calcularTakeOffPoint(temperatura, elevacion) {
            // Si es sea level (0 pies), usar la línea principal
            if (elevacion === 0) {
                const yLinea = 500 + (1160 - 500) * (temperatura - (-7.7)) / (40 - (-7.7));
                return {
                    x: tempToX(temperatura),
                    y: valorToY(yLinea),
                    takeOffDistance: yLinea
                };
            }

            // Identificar las líneas de elevación cercanas
            const elevacionInferior = Math.floor(elevacion / 1000) * 1000;
            const elevacionSuperior = Math.ceil(elevacion / 1000) * 1000;

            // Casos especiales para elevaciones exactas
            if (elevacion === elevacionInferior && elevacion > 0) {
                const indice = (elevacion / 1000) - 1;
                const linea = lineasIzquierda[indice];
                const yLinea = linea.y1 + (linea.y2 - linea.y1) *
                              (temperatura - linea.x1) / (linea.x2 - linea.x1);
                return {
                    x: tempToX(temperatura),
                    y: valorToY(yLinea),
                    takeOffDistance: yLinea
                };
            }

            // Interpolación entre dos líneas
            let indiceInferior, indiceSuperior, lineaInferior, lineaSuperior;

            if (elevacionInferior === 0) {
                // Interpolar entre línea principal (sea level) y primera línea (1000)
                const yInferior = 500 + (1160 - 500) * (temperatura - (-7.7)) / (40 - (-7.7));
                lineaSuperior = lineasIzquierda[0];
                const ySuperior = lineaSuperior.y1 + (lineaSuperior.y2 - lineaSuperior.y1) *
                                  (temperatura - lineaSuperior.x1) / (lineaSuperior.x2 - lineaSuperior.x1);

                const factor = elevacion / 1000;
                const yFinal = yInferior + factor * (ySuperior - yInferior);

                return {
                    x: tempToX(temperatura),
                    y: valorToY(yFinal),
                    takeOffDistance: yFinal
                };
            } else {
                indiceInferior = (elevacionInferior / 1000) - 1;
                indiceSuperior = (elevacionSuperior / 1000) - 1;

                lineaInferior = lineasIzquierda[indiceInferior];
                lineaSuperior = lineasIzquierda[indiceSuperior];

                const yInferior = lineaInferior.y1 + (lineaInferior.y2 - lineaInferior.y1) *
                                  (temperatura - lineaInferior.x1) / (lineaInferior.x2 - lineaInferior.x1);

                const ySuperior = lineaSuperior.y1 + (lineaSuperior.y2 - lineaSuperior.y1) *
                                  (temperatura - lineaSuperior.x1) / (lineaSuperior.x2 - lineaSuperior.x1);

                const factor = (elevacion - elevacionInferior) / 1000;
                const yFinal = yInferior + factor * (ySuperior - yInferior);

                return {
                    x: tempToX(temperatura),
                    y: valorToY(yFinal),
                    takeOffDistance: yFinal
                };
            }
        }

        // Función para calcular el punto de landing performance
        function calcularLandingPoint(temperatura, elevacion) {
            // Si es sea level (0 pies), usar la línea principal (primera línea)
            if (elevacion === 0) {
                const lineaSeaLevel = lineasTempLanding[0];
                const yLinea = lineaSeaLevel.y1 + (lineaSeaLevel.y2 - lineaSeaLevel.y1) *
                              (temperatura - lineaSeaLevel.x1) / (lineaSeaLevel.x2 - lineaSeaLevel.x1);
                return {
                    x: tempToX2(temperatura),
                    y: valorToY2(yLinea),
                    landingDistance: yLinea
                };
            }

            // Identificar las líneas de elevación cercanas (incrementos de 2000)
            const elevacionInferior = Math.floor(elevacion / 2000) * 2000;
            const elevacionSuperior = Math.ceil(elevacion / 2000) * 2000;

            // Casos especiales para elevaciones exactas
            if (elevacion === elevacionInferior && elevacion > 0) {
                const indice = (elevacion / 2000); // 2000->1, 4000->2, 6000->3, 8000->4
                const linea = lineasTempLanding[indice];
                const yLinea = linea.y1 + (linea.y2 - linea.y1) *
                              (temperatura - linea.x1) / (linea.x2 - linea.x1);
                return {
                    x: tempToX2(temperatura),
                    y: valorToY2(yLinea),
                    landingDistance: yLinea
                };
            }

            // Interpolación entre dos líneas
            let indiceInferior, indiceSuperior, lineaInferior, lineaSuperior;

            if (elevacionInferior === 0) {
                // Interpolar entre línea principal (sea level) y primera línea (2000)
                lineaInferior = lineasTempLanding[0]; // SEA LEVEL
                const yInferior = lineaInferior.y1 + (lineaInferior.y2 - lineaInferior.y1) *
                                  (temperatura - lineaInferior.x1) / (lineaInferior.x2 - lineaInferior.x1);

                lineaSuperior = lineasTempLanding[1]; // 2000
                const ySuperior = lineaSuperior.y1 + (lineaSuperior.y2 - lineaSuperior.y1) *
                                  (temperatura - lineaSuperior.x1) / (lineaSuperior.x2 - lineaSuperior.x1);

                const factor = elevacion / 2000;
                const yFinal = yInferior + factor * (ySuperior - yInferior);

                return {
                    x: tempToX2(temperatura),
                    y: valorToY2(yFinal),
                    landingDistance: yFinal
                };
            } else {
                indiceInferior = (elevacionInferior / 2000);
                indiceSuperior = (elevacionSuperior / 2000);

                lineaInferior = lineasTempLanding[indiceInferior];
                lineaSuperior = lineasTempLanding[indiceSuperior];

                const yInferior = lineaInferior.y1 + (lineaInferior.y2 - lineaInferior.y1) *
                                  (temperatura - lineaInferior.x1) / (lineaInferior.x2 - lineaInferior.x1);

                const ySuperior = lineaSuperior.y1 + (lineaSuperior.y2 - lineaSuperior.y1) *
                                  (temperatura - lineaSuperior.x1) / (lineaSuperior.x2 - lineaSuperior.x1);

                const factor = (elevacion - elevacionInferior) / 2000;
                const yFinal = yInferior + factor * (ySuperior - yInferior);

                return {
                    x: tempToX2(temperatura),
                    y: valorToY2(yFinal),
                    landingDistance: yFinal
                };
            }
        }

        // Función para encontrar las líneas más cercanas en wind = 0
        function encontrarLineasCercanasWind(yValor) {
            let lineaSuperior = null;
            let lineaInferior = null;
            let indiceSuperior = -1;
            let indiceInferior = -1;

            for (let i = 0; i < lineasDerecha.length; i++) {
                const yLineaEnWind0 = lineasDerecha[i].y1;

                // Línea superior: y1 <= yValor (más abajo o igual en la gráfica, mayor en valor)
                if (yLineaEnWind0 <= yValor) {
                    if (lineaSuperior === null || yLineaEnWind0 > lineaSuperior.y1) {
                        lineaSuperior = lineasDerecha[i];
                        indiceSuperior = i;
                    }
                }

                // Línea inferior: y1 > yValor (más arriba en la gráfica, menor en valor)
                if (yLineaEnWind0 > yValor) {
                    if (lineaInferior === null || yLineaEnWind0 < lineaInferior.y1) {
                        lineaInferior = lineasDerecha[i];
                        indiceInferior = i;
                    }
                }
            }

            return { lineaSuperior, lineaInferior, indiceSuperior, indiceInferior };
        }

        // Función para encontrar las líneas más cercanas en wind = 0 (Landing)
        function encontrarLineasCercanasWindLanding(yValor) {
            let lineaSuperior = null;
            let lineaInferior = null;
            let indiceSuperior = -1;
            let indiceInferior = -1;

            for (let i = 0; i < lineasWindLanding.length; i++) {
                const yLineaEnWind0 = lineasWindLanding[i].y1;

                // Línea superior: y1 <= yValor (más abajo o igual en la gráfica, mayor en valor)
                if (yLineaEnWind0 <= yValor) {
                    if (lineaSuperior === null || yLineaEnWind0 > lineaSuperior.y1) {
                        lineaSuperior = lineasWindLanding[i];
                        indiceSuperior = i;
                    }
                }

                // Línea inferior: y1 > yValor (más arriba en la gráfica, menor en valor)
                if (yLineaEnWind0 > yValor) {
                    if (lineaInferior === null || yLineaEnWind0 < lineaInferior.y1) {
                        lineaInferior = lineasWindLanding[i];
                        indiceInferior = i;
                    }
                }
            }

            return { lineaSuperior, lineaInferior, indiceSuperior, indiceInferior };
        }

        // Función para calcular punto con ajuste de viento
        function calcularPuntoConViento(yInicial, viento) {
            // Encontrar líneas cercanas
            const { lineaSuperior, lineaInferior } = encontrarLineasCercanasWind(yInicial);

            // Caso 1: Está exactamente sobre una línea
            if (lineaSuperior && lineaSuperior.y1 === yInicial) {
                const yFinal = lineaSuperior.y1 + (lineaSuperior.y2 - lineaSuperior.y1) *
                               (viento - 0) / (15 - 0);
                return {
                    x: windToX(viento),
                    y: valorToY(yFinal),
                    takeOffDistance: yFinal
                };
            }

            // Caso 2: Interpolar entre dos líneas
            if (lineaSuperior && lineaInferior) {
                // Calcular Y en cada línea para el viento dado
                const ySuperior = lineaSuperior.y1 + (lineaSuperior.y2 - lineaSuperior.y1) *
                                  (viento - 0) / (15 - 0);
                const yInferior = lineaInferior.y1 + (lineaInferior.y2 - lineaInferior.y1) *
                                  (viento - 0) / (15 - 0);

                // Interpolar entre los dos valores Y
                const factor = (yInicial - lineaInferior.y1) / (lineaSuperior.y1 - lineaInferior.y1);
                const yFinal = yInferior + factor * (ySuperior - yInferior);

                return {
                    x: windToX(viento),
                    y: valorToY(yFinal),
                    takeOffDistance: yFinal
                };
            }

            // Caso 3: Solo una línea disponible (extremo)
            const lineaUsar = lineaSuperior || lineaInferior;
            if (lineaUsar) {
                const yFinal = lineaUsar.y1 + (lineaUsar.y2 - lineaUsar.y1) *
                               (viento - 0) / (15 - 0);
                return {
                    x: windToX(viento),
                    y: valorToY(yFinal),
                    takeOffDistance: yFinal
                };
            }

            // Fallback: sin líneas disponibles, retornar valor sin ajuste
            return {
                x: windToX(viento),
                y: valorToY(yInicial),
                takeOffDistance: yInicial
            };
        }

        // Función para calcular punto con ajuste de viento (Landing)
        function calcularPuntoConVientoLanding(yInicial, viento) {
            // Encontrar líneas cercanas
            const { lineaSuperior, lineaInferior } = encontrarLineasCercanasWindLanding(yInicial);

            // Caso 1: Está exactamente sobre una línea
            if (lineaSuperior && lineaSuperior.y1 === yInicial) {
                // Limitar viento al máximo de la línea
                const vientoLimitado = Math.min(viento, lineaSuperior.x2);
                const yFinal = lineaSuperior.y1 + (lineaSuperior.y2 - lineaSuperior.y1) *
                               (vientoLimitado - lineaSuperior.x1) / (lineaSuperior.x2 - lineaSuperior.x1);
                return {
                    x: windToX2(vientoLimitado),
                    y: valorToY2(yFinal),
                    landingDistance: yFinal
                };
            }

            // Caso 2: Interpolar entre dos líneas
            if (lineaSuperior && lineaInferior) {
                // Limitar viento al máximo de cada línea
                const vientoSuperiorLimitado = Math.min(viento, lineaSuperior.x2);
                const vientoInferiorLimitado = Math.min(viento, lineaInferior.x2);

                // Calcular Y en cada línea para el viento dado
                const ySuperior = lineaSuperior.y1 + (lineaSuperior.y2 - lineaSuperior.y1) *
                                  (vientoSuperiorLimitado - lineaSuperior.x1) / (lineaSuperior.x2 - lineaSuperior.x1);
                const yInferior = lineaInferior.y1 + (lineaInferior.y2 - lineaInferior.y1) *
                                  (vientoInferiorLimitado - lineaInferior.x1) / (lineaInferior.x2 - lineaInferior.x1);

                // Interpolar entre los dos valores Y
                const factor = (yInicial - lineaInferior.y1) / (lineaSuperior.y1 - lineaInferior.y1);
                const yFinal = yInferior + factor * (ySuperior - yInferior);

                // Usar el viento de la línea que tiene mayor rango para la posición X
                const vientoFinal = Math.min(viento, Math.max(lineaSuperior.x2, lineaInferior.x2));

                return {
                    x: windToX2(vientoFinal),
                    y: valorToY2(yFinal),
                    landingDistance: yFinal
                };
            }

            // Caso 3: Solo una línea disponible (extremo)
            const lineaUsar = lineaSuperior || lineaInferior;
            if (lineaUsar) {
                // Limitar viento al máximo de la línea
                const vientoLimitado = Math.min(viento, lineaUsar.x2);
                const yFinal = lineaUsar.y1 + (lineaUsar.y2 - lineaUsar.y1) *
                               (vientoLimitado - lineaUsar.x1) / (lineaUsar.x2 - lineaUsar.x1);
                return {
                    x: windToX2(vientoLimitado),
                    y: valorToY2(yFinal),
                    landingDistance: yFinal
                };
            }

            // Fallback: sin líneas disponibles, retornar valor sin ajuste
            return {
                x: windToX2(viento),
                y: valorToY2(yInicial),
                landingDistance: yInicial
            };
        }

        // Función para dibujar el punto y las líneas guía
        function dibujarPunto(resultado, viento) {
            // Limpiar dibujo anterior
            limpiarDibujo();

            // Dibujar línea vertical desde la temperatura
            lineaVertical = document.createElementNS(svgNS, 'line');
            lineaVertical.setAttribute('x1', resultado.x);
            lineaVertical.setAttribute('y1', 360); // Desde abajo
            lineaVertical.setAttribute('x2', resultado.x);
            lineaVertical.setAttribute('y2', resultado.y);
            lineaVertical.setAttribute('stroke', 'blue');
            lineaVertical.setAttribute('stroke-width', '1.5');
            lineaVertical.setAttribute('stroke-dasharray', '5,5');
            svg.appendChild(lineaVertical);

            // Variables para punto final y distancia
            let puntoFinal = resultado;
            let distanciaFinal = resultado.takeOffDistance;

            // Si hay viento, calcular ajuste
            if (viento && viento > 0) {
                // Dibujar línea horizontal hasta el 0 de winds (cuadro 55)
                lineaHorizontal = document.createElementNS(svgNS, 'line');
                lineaHorizontal.setAttribute('x1', resultado.x);
                lineaHorizontal.setAttribute('y1', resultado.y);
                lineaHorizontal.setAttribute('x2', windToX(0)); // Termina en el 0 de winds
                lineaHorizontal.setAttribute('y2', resultado.y);
                lineaHorizontal.setAttribute('stroke', 'blue');
                lineaHorizontal.setAttribute('stroke-width', '1.5');
                lineaHorizontal.setAttribute('stroke-dasharray', '5,5');
                svg.appendChild(lineaHorizontal);
                const puntoViento = calcularPuntoConViento(resultado.takeOffDistance, viento);

                // Dibujar línea paralela desde wind=0 hasta viento ingresado
                lineaParalela = document.createElementNS(svgNS, 'line');
                lineaParalela.setAttribute('x1', windToX(0));
                lineaParalela.setAttribute('y1', resultado.y);
                lineaParalela.setAttribute('x2', puntoViento.x);
                lineaParalela.setAttribute('y2', puntoViento.y);
                lineaParalela.setAttribute('stroke', 'blue');
                lineaParalela.setAttribute('stroke-width', '1.5');
                lineaParalela.setAttribute('stroke-dasharray', '5,5');
                svg.appendChild(lineaParalela);

                // Dibujar línea horizontal final desde punto de viento hacia la derecha
                lineaFinal = document.createElementNS(svgNS, 'line');
                lineaFinal.setAttribute('x1', puntoViento.x);
                lineaFinal.setAttribute('y1', puntoViento.y);
                // Extender al menos 50px a la derecha del punto, o hasta 480 si es menor
                lineaFinal.setAttribute('x2', Math.max(puntoViento.x + 50, 480));
                lineaFinal.setAttribute('y2', puntoViento.y);
                lineaFinal.setAttribute('stroke', 'blue');
                lineaFinal.setAttribute('stroke-width', '1.5');
                lineaFinal.setAttribute('stroke-dasharray', '5,5');
                svg.appendChild(lineaFinal);

                // Actualizar punto final
                puntoFinal = puntoViento;
                distanciaFinal = puntoViento.takeOffDistance;
            } else {
                // Si viento es 0, dibujar línea horizontal directamente hasta el borde derecho
                lineaHorizontal = document.createElementNS(svgNS, 'line');
                lineaHorizontal.setAttribute('x1', resultado.x);
                lineaHorizontal.setAttribute('y1', resultado.y);
                lineaHorizontal.setAttribute('x2', 480); // Hasta el borde derecho
                lineaHorizontal.setAttribute('y2', resultado.y);
                lineaHorizontal.setAttribute('stroke', 'blue');
                lineaHorizontal.setAttribute('stroke-width', '1.5');
                lineaHorizontal.setAttribute('stroke-dasharray', '5,5');
                svg.appendChild(lineaHorizontal);
            }

            // Dibujar el punto (en la posición final)
            puntoActual = document.createElementNS(svgNS, 'circle');
            puntoActual.setAttribute('cx', puntoFinal.x);
            puntoActual.setAttribute('cy', puntoFinal.y);
            puntoActual.setAttribute('r', '5');
            puntoActual.setAttribute('fill', 'red');
            puntoActual.setAttribute('stroke', 'black');
            puntoActual.setAttribute('stroke-width', '2');
            svg.appendChild(puntoActual);

            // Etiqueta con el valor (en la posición final)
            etiquetaResultado = document.createElementNS(svgNS, 'text');
            etiquetaResultado.setAttribute('x', puntoFinal.x + 10);
            etiquetaResultado.setAttribute('y', puntoFinal.y - 10);
            etiquetaResultado.setAttribute('font-family', 'Arial, sans-serif');
            etiquetaResultado.setAttribute('font-size', '11');
            etiquetaResultado.setAttribute('font-weight', 'bold');
            etiquetaResultado.setAttribute('fill', 'red');
            etiquetaResultado.setAttribute('stroke', 'white');
            etiquetaResultado.setAttribute('stroke-width', '2');
            etiquetaResultado.setAttribute('paint-order', 'stroke');
            etiquetaResultado.textContent = Math.round(distanciaFinal) + ' ft';
            svg.appendChild(etiquetaResultado);

            // Retornar distancia final para mostrar en el resultado
            return distanciaFinal;
        }

        // Función para dibujar el punto y las líneas guía (Landing)
        function dibujarPuntoLanding(resultado, viento) {
            // Limpiar dibujo anterior
            limpiarDibujoLanding();

            // Dibujar línea vertical desde la temperatura
            lineaVerticalLanding = document.createElementNS(svgNS, 'line');
            lineaVerticalLanding.setAttribute('x1', resultado.x);
            lineaVerticalLanding.setAttribute('y1', 240); // Desde abajo (240px de altura)
            lineaVerticalLanding.setAttribute('x2', resultado.x);
            lineaVerticalLanding.setAttribute('y2', resultado.y);
            lineaVerticalLanding.setAttribute('stroke', 'blue');
            lineaVerticalLanding.setAttribute('stroke-width', '1.5');
            lineaVerticalLanding.setAttribute('stroke-dasharray', '5,5');
            svg2.appendChild(lineaVerticalLanding);

            // Variables para punto final y distancia
            let puntoFinal = resultado;
            let distanciaFinal = resultado.landingDistance;

            // Si hay viento, calcular ajuste
            if (viento && viento > 0) {
                // Dibujar línea horizontal hasta el 0 de winds (cuadro 70)
                lineaHorizontalLanding = document.createElementNS(svgNS, 'line');
                lineaHorizontalLanding.setAttribute('x1', resultado.x);
                lineaHorizontalLanding.setAttribute('y1', resultado.y);
                lineaHorizontalLanding.setAttribute('x2', windToX2(0)); // Termina en el 0 de winds
                lineaHorizontalLanding.setAttribute('y2', resultado.y);
                lineaHorizontalLanding.setAttribute('stroke', 'blue');
                lineaHorizontalLanding.setAttribute('stroke-width', '1.5');
                lineaHorizontalLanding.setAttribute('stroke-dasharray', '5,5');
                svg2.appendChild(lineaHorizontalLanding);

                const puntoViento = calcularPuntoConVientoLanding(resultado.landingDistance, viento);

                // Dibujar línea paralela desde wind=0 hasta viento ingresado
                lineaParalelaLanding = document.createElementNS(svgNS, 'line');
                lineaParalelaLanding.setAttribute('x1', windToX2(0));
                lineaParalelaLanding.setAttribute('y1', resultado.y);
                lineaParalelaLanding.setAttribute('x2', puntoViento.x);
                lineaParalelaLanding.setAttribute('y2', puntoViento.y);
                lineaParalelaLanding.setAttribute('stroke', 'blue');
                lineaParalelaLanding.setAttribute('stroke-width', '1.5');
                lineaParalelaLanding.setAttribute('stroke-dasharray', '5,5');
                svg2.appendChild(lineaParalelaLanding);

                // Dibujar línea horizontal final desde punto de viento hacia la derecha
                lineaFinalLanding = document.createElementNS(svgNS, 'line');
                lineaFinalLanding.setAttribute('x1', puntoViento.x);
                lineaFinalLanding.setAttribute('y1', puntoViento.y);
                // Extender al menos 50px a la derecha del punto, o hasta 600 si es menor
                lineaFinalLanding.setAttribute('x2', Math.max(puntoViento.x + 50, 600));
                lineaFinalLanding.setAttribute('y2', puntoViento.y);
                lineaFinalLanding.setAttribute('stroke', 'blue');
                lineaFinalLanding.setAttribute('stroke-width', '1.5');
                lineaFinalLanding.setAttribute('stroke-dasharray', '5,5');
                svg2.appendChild(lineaFinalLanding);

                // Actualizar punto final
                puntoFinal = puntoViento;
                distanciaFinal = puntoViento.landingDistance;
            } else {
                // Si viento es 0, dibujar línea horizontal directamente hasta el borde derecho
                lineaHorizontalLanding = document.createElementNS(svgNS, 'line');
                lineaHorizontalLanding.setAttribute('x1', resultado.x);
                lineaHorizontalLanding.setAttribute('y1', resultado.y);
                lineaHorizontalLanding.setAttribute('x2', 600); // Hasta el borde derecho
                lineaHorizontalLanding.setAttribute('y2', resultado.y);
                lineaHorizontalLanding.setAttribute('stroke', 'blue');
                lineaHorizontalLanding.setAttribute('stroke-width', '1.5');
                lineaHorizontalLanding.setAttribute('stroke-dasharray', '5,5');
                svg2.appendChild(lineaHorizontalLanding);
            }

            // Dibujar el punto (en la posición final)
            puntoActualLanding = document.createElementNS(svgNS, 'circle');
            puntoActualLanding.setAttribute('cx', puntoFinal.x);
            puntoActualLanding.setAttribute('cy', puntoFinal.y);
            puntoActualLanding.setAttribute('r', '5');
            puntoActualLanding.setAttribute('fill', 'red');
            puntoActualLanding.setAttribute('stroke', 'black');
            puntoActualLanding.setAttribute('stroke-width', '2');
            svg2.appendChild(puntoActualLanding);

            // Etiqueta con el valor (en la posición final)
            etiquetaResultadoLanding = document.createElementNS(svgNS, 'text');
            etiquetaResultadoLanding.setAttribute('x', puntoFinal.x + 10);
            etiquetaResultadoLanding.setAttribute('y', puntoFinal.y - 10);
            etiquetaResultadoLanding.setAttribute('font-family', 'Arial, sans-serif');
            etiquetaResultadoLanding.setAttribute('font-size', '11');
            etiquetaResultadoLanding.setAttribute('font-weight', 'bold');
            etiquetaResultadoLanding.setAttribute('fill', 'red');
            etiquetaResultadoLanding.setAttribute('stroke', 'white');
            etiquetaResultadoLanding.setAttribute('stroke-width', '2');
            etiquetaResultadoLanding.setAttribute('paint-order', 'stroke');
            etiquetaResultadoLanding.textContent = Math.round(distanciaFinal) + ' ft';
            svg2.appendChild(etiquetaResultadoLanding);

            // Retornar distancia final para mostrar en el resultado
            return distanciaFinal;
        }

        // Función para limpiar el dibujo
        function limpiarDibujo() {
            if (puntoActual) svg.removeChild(puntoActual);
            if (lineaVertical) svg.removeChild(lineaVertical);
            if (lineaHorizontal) svg.removeChild(lineaHorizontal);
            if (lineaParalela) svg.removeChild(lineaParalela);
            if (lineaFinal) svg.removeChild(lineaFinal);
            if (etiquetaResultado) svg.removeChild(etiquetaResultado);

            puntoActual = null;
            lineaVertical = null;
            lineaHorizontal = null;
            lineaParalela = null;
            lineaFinal = null;
            etiquetaResultado = null;
        }

        // Función para limpiar el dibujo (Landing)
        function limpiarDibujoLanding() {
            if (puntoActualLanding) svg2.removeChild(puntoActualLanding);
            if (lineaVerticalLanding) svg2.removeChild(lineaVerticalLanding);
            if (lineaHorizontalLanding) svg2.removeChild(lineaHorizontalLanding);
            if (lineaParalelaLanding) svg2.removeChild(lineaParalelaLanding);
            if (lineaFinalLanding) svg2.removeChild(lineaFinalLanding);
            if (etiquetaResultadoLanding) svg2.removeChild(etiquetaResultadoLanding);

            puntoActualLanding = null;
            lineaVerticalLanding = null;
            lineaHorizontalLanding = null;
            lineaParalelaLanding = null;
            lineaFinalLanding = null;
            etiquetaResultadoLanding = null;
        }

        // Event listeners
        document.getElementById('calcular').addEventListener('click', function() {
            const temperatura = parseFloat(document.getElementById('temperatura').value);
            const elevacion = parseFloat(document.getElementById('elevacion').value);
            const viento = parseFloat(document.getElementById('viento').value) || 0;

            // Validaciones
            if (isNaN(temperatura) || temperatura < -30 || temperatura > 40) {
                alert('Por favor ingrese una temperatura válida entre -30 y 40°C');
                return;
            }

            if (isNaN(elevacion) || elevacion < 0 || elevacion > 7000) {
                alert('Por favor ingrese una elevación válida entre 0 y 7000 pies');
                return;
            }

            if (viento < 0 || viento > 15) {
                alert('Por favor ingrese un viento válido entre 0 y 15 knots');
                return;
            }

            // Calcular y dibujar Take Off Performance
            const resultado = calcularTakeOffPoint(temperatura, elevacion);
            const distanciaFinalTakeOff = dibujarPunto(resultado, viento);

            // Calcular y dibujar Landing Ground Roll
            const resultadoLanding = calcularLandingPoint(temperatura, elevacion);
            const distanciaFinalLanding = dibujarPuntoLanding(resultadoLanding, viento);

            // Mostrar resultados
            const piesTakeOff = Math.round(distanciaFinalTakeOff);
            const metrosTakeOff = Math.round(distanciaFinalTakeOff * 0.3048);
            const piesLanding = Math.round(distanciaFinalLanding);
            const metrosLanding = Math.round(distanciaFinalLanding * 0.3048);

            let textoResultado = `Take-off: ${piesTakeOff} ft (${metrosTakeOff} m)\nLanding: ${piesLanding} ft (${metrosLanding} m)`;
            if (viento > 0) {
                textoResultado += `\nViento: ${viento} kt`;
            }
            document.getElementById('resultado').textContent = textoResultado;
        });

        document.getElementById('limpiar').addEventListener('click', function() {
            limpiarDibujo();
            limpiarDibujoLanding();
            document.getElementById('temperatura').value = '';
            document.getElementById('elevacion').value = '';
            document.getElementById('viento').value = '';
            document.getElementById('resultado').textContent = '';
            // Limpiar mensaje de error de viento
            const errorViento = document.getElementById('error-viento');
            errorViento.classList.remove('visible');
            errorViento.textContent = '';
        });

        // Validación en tiempo real del viento
        document.getElementById('viento').addEventListener('input', function() {
            const viento = parseFloat(this.value);
            const errorViento = document.getElementById('error-viento');

            if (this.value === '') {
                // Campo vacío, no mostrar error
                errorViento.classList.remove('visible');
                errorViento.textContent = '';
            } else if (isNaN(viento) || viento < 0) {
                errorViento.textContent = 'El viento no puede ser negativo';
                errorViento.classList.add('visible');
            } else if (viento > 15) {
                errorViento.textContent = 'El viento máximo es 15 knots';
                errorViento.classList.add('visible');
            } else {
                // Valor válido, ocultar error
                errorViento.classList.remove('visible');
                errorViento.textContent = '';
            }
        });
    </script>
</body>
</html>
